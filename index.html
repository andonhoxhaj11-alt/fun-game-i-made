<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --line: #e5e7eb;
      --accent: #60a5fa;
      --text: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #0f172a, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #scoreboard {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      background: rgba(31, 41, 55, 0.8);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    canvas {
      display: block;
      background: #0b1220;
      border: 3px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      width: min(90vw, 900px);
      height: auto;
      cursor: none;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div id="scoreboard">
      <span id="leftScore">0</span> : <span id="rightScore">0</span>
    </div>
    <canvas id="game" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const paddleWidth = 14;
    const paddleHeight = 100;
    const paddleSpeed = 7;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: paddleSpeed
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.3
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      speed: 5.5,
      vx: 5.5,
      vy: 3
    };

    let leftScore = 0;
    let rightScore = 0;
    const keys = {};

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateScoreboard() {
      leftScoreEl.textContent = leftScore;
      rightScoreEl.textContent = rightScore;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5.5 + Math.random() * 1.2;

      const angle = (Math.random() * 1.4) - 0.7; // between -0.7 and 0.7 radians
      ball.vx = direction * ball.speed * Math.cos(angle + (Math.PI / 4));
      ball.vy = ball.speed * Math.sin(angle + (Math.PI / 4));
    }

    function handlePaddleInput() {
      if (keys["ArrowUp"]) {
        leftPaddle.y -= leftPaddle.speed;
      }

      if (keys["ArrowDown"]) {
        leftPaddle.y += leftPaddle.speed;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function updateComputer() {
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      rightPaddle.y += diff * 0.12;
      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function detectWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }
    }

    function detectPaddleCollision() {
      // Left paddle
      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius >= leftPaddle.x &&
        ball.y - ball.radius <= leftPaddle.y + leftPaddle.height &&
        ball.y + ball.radius >= leftPaddle.y
      ) {
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
        const relativeIntersectY = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) + 0.4;

        ball.vx = Math.abs(Math.cos(bounceAngle)) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }

      // Right paddle
      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
        ball.y - ball.radius <= rightPaddle.y + rightPaddle.height &&
        ball.y + ball.radius >= rightPaddle.y
      ) {
        ball.x = rightPaddle.x - ball.radius;
        const relativeIntersectY = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) + 0.4;

        ball.vx = -Math.abs(Math.cos(bounceAngle)) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.radius < 0) {
        rightScore++;
        updateScoreboard();
        resetBall(1);
      } else if (ball.x + ball.radius > canvas.width) {
        leftScore++;
        updateScoreboard();
        resetBall(-1);
      }

      detectWallCollision();
      detectPaddleCollision();
    }

    function drawPaddle(paddle, color) {
      ctx.fillStyle = color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.closePath();
    }

    function drawMiddleLine() {
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawMiddleLine();
      drawPaddle(leftPaddle, "#60a5fa");
      drawPaddle(rightPaddle, "#f87171");
      drawBall();
    }

    function gameLoop() {
      handlePaddleInput();
      updateComputer();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Mouse control for left paddle
    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    });

    // Keyboard control for left paddle
    document.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
      }
      keys[event.key] = true;
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key] = false;
    });

    updateScoreboard();
    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
